name: Build for Mac

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git

      - name: "Configure (Universal - Apple Silicon + Intel)"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 / AU / Standalone
        run: cmake --build build --config Release -j 4

      - name: Sign (ad-hoc)
        run: |
          A=build/Kizami_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/Kizami.vst3"
          codesign --force --deep --sign - "$A/AU/Kizami.component"
          codesign --force --deep --sign - "$A/Standalone/Kizami.app"
          lipo -info "$A/VST3/Kizami.vst3/Contents/MacOS/Kizami" | tee build-report.txt
          lipo -info "$A/AU/Kizami.component/Contents/MacOS/Kizami" | tee -a build-report.txt

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Kizami_artefacts/Release/AU/Kizami.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu Kzm1 Kzmi | tee auval.txt
          tail -5 auval.txt >> build-report.txt

      - name: Package
        run: |
          A=build/Kizami_artefacts/Release
          mkdir -p Kizami
          cp -R "$A/VST3/Kizami.vst3" "$A/AU/Kizami.component" "$A/Standalone/Kizami.app" Kizami/
          cp dist-extras/* Kizami/
          chmod +x "Kizami/Kizamiをインストール.command"
          ditto -c -k --sequesterRsrc --keepParent Kizami Kizami-mac.zip

      - name: Publish as a GitHub Release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          printf 'Kizami Mac版(VST3 / AU / 単体アプリ・Apple Silicon + Intel)\n\nKizami-mac.zip をダウンロードして解凍し、「はじめにお読みください.txt」の手順でインストールしてください。\n' > notes.txt
          gh release create "$TAG" Kizami-mac.zip --title "Kizami $TAG" --notes-file notes.txt --latest

      - name: Keep a copy on the builds branch
        run: |
          git config user.name "kizami-bot"
          git config user.email "noreply@github.com"
          mkdir -p /tmp/out && cp Kizami-mac.zip build-report.txt /tmp/out/
          git checkout --orphan builds
          git rm -rf -q . || true
          rm -rf JUCE build Kizami
          cp /tmp/out/* .
          git add Kizami-mac.zip build-report.txt
          git commit -q -m "Mac build ${{ github.run_number }}"
          git push -f origin builds

      - uses: actions/upload-artifact@v4
        with:
          name: Kizami-mac
          path: Kizami-mac.zip
          retention-days: 30
